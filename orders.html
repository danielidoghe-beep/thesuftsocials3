<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Orders | thesuftsocials</title>

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="orders.css">

</head>

<body>

<!-- ==========================================
LOADING SCREEN
========================================== -->

<div
    class="loading-screen"
    id="loadingScreen">

    <div class="loading-content">

        <div class="logo-stack">

            <div class="stack one"></div>

            <div class="stack two"></div>

            <div class="stack three"></div>

        </div>

        <h2>thesuftsocials</h2>

    </div>

</div>

<!-- ==========================================
ORDERS PAGE
========================================== -->

<div class="orders-page">

    <!-- PAGE TITLE -->

    <section class="orders-title">

        <h1>

            Orders

        </h1>

        <p>

            Your purchase history

        </p>

    </section>
        <!-- ==========================================
    RECENT ORDERS
    ========================================== -->

    <section class="orders-card">

        <div class="orders-header">

            <h2>

                RECENT ORDERS

            </h2>

        </div>

        <!-- Orders from Firebase will load here -->

        <div
            id="ordersList"
            class="orders-list">

            <!-- EMPTY STATE -->

            <div
                id="emptyOrders"
                class="empty-orders">

                <div class="empty-icon">

                    <i class="ri-shopping-bag-3-line"></i>

                </div>

                <h3>

                    No orders yet

                </h3>

                <p>

                    You have not made any purchases yet.

                </p>

            </div>

        </div>

    </section>
    <!-- ==========================================
ORDER DETAILS POPUP
========================================== -->

<div
    class="order-overlay"
    id="orderOverlay">

</div>

<div
    class="order-modal"
    id="orderModal">

    <div class="order-sheet">

        <!-- HEADER -->

        <div class="order-modal-header">

            <h2>

                Order Details

            </h2>

            <button
                id="closeOrder"
                class="close-order-btn">

                <i class="ri-close-line"></i>

            </button>

        </div>

        <!-- PRODUCT -->

        <div class="order-product">

            <img
                id="modalProductImage"
                src=""
                alt="Product">

            <div>

                <h3 id="modalProductName">

                    Product Name

                </h3>

                <p id="modalOrderId">

                    Order ID

                </p>

            </div>

        </div>

        <!-- DETAILS -->

        <div class="order-details">

            <div class="detail-row">

                <span>Amount</span>

                <strong id="modalAmount">

                    ₦0

                </strong>

            </div>

            <div class="detail-row">

                <span>Quantity</span>

                <strong id="modalQuantity">

                    1

                </strong>

            </div>

            <div class="detail-row">

                <span>Status</span>

                <strong id="modalStatus">

                    Pending

                </strong>

            </div>

            <div class="detail-row">

                <span>Date</span>

                <strong id="modalDate">

                    --

                </strong>

            </div>

        </div>

    </div>

</div>
<!-- ==========================================
BOTTOM SPACE
========================================== -->

<div class="bottom-space"></div>

</div>

<!-- ==========================================
SCRIPTS
========================================== -->

<script type="module"
        src="firebase.js"></script>

<script type="module"
        src="orders.js"></script>

</body>

</html>
