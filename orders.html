<!-- ==========================================
ORDERS PAGE
========================================== -->

<div class="orders-page">

    <!-- PAGE TITLE -->

    <section class="orders-title">

        <h1>Orders</h1>

        <p>Your purchase history</p>

    </section>

    <!-- ==========================================
    RECENT ORDERS
    ========================================== -->

    <section class="orders-section">

        <div class="orders-header">

            <h2>RECENT ORDERS</h2>

        </div>

        <!-- Orders will load here from Firebase -->

        <div id="ordersList">

            <!-- EMPTY STATE -->

            <div
                id="emptyOrders"
                class="empty-orders">

                <div class="empty-card">

                    <h3>No orders yet</h3>

                    <p>
                        You have not made any purchases yet.
                    </p>

                </div>

            </div>

        </div>

    </section>

</div>
        <!-- EMPTY STATE -->

        <div
            id="emptyOrders"
            class="empty-orders">

            <div class="empty-card">

                <h3>
                    No orders yet
                </h3>

                <p>
                    You have not made any purchases yet.
                </p>

            </div>

        </div>

        <!-- ORDERS WILL LOAD HERE -->

        <div
            id="ordersList"
            class="orders-list">

            <!-- Firebase inserts orders here -->

        </div>

    </section>

</div>

<!-- ==========================================
ORDER DETAILS MODAL
========================================== -->

<div
    class="order-overlay"
    id="orderOverlay">

</div>

<div
    class="order-modal"
    id="orderModal">

    <div class="order-sheet">

        <div class="order-header">

            <h2>
                Order Details
            </h2>

            <button
                id="closeOrder">

                <i class="ri-close-line"></i>

            </button>

        </div>

        <div class="order-body">

            <div class="detail-row">

                <span>Service</span>

                <strong id="modalService">

                    --

                </strong>

            </div>

            <div class="detail-row">

                <span>Amount</span>

                <strong id="modalAmount">

                    ₦0

                </strong>

            </div>

            <div class="detail-row">

                <span>Status</span>

                <strong id="modalStatus">

                    Pending

                </strong>

            </div>

            <div class="detail-row">

                <span>Order ID</span>

                <strong id="modalOrderId">

                    --

                </strong>

            </div>

            <div class="detail-row">

                <span>Date</span>

                <strong id="modalDate">

                    --

                </strong>

            </div>

        </div>

    </div>

</div>
<!-- ORDERS LIST -->

<div id="ordersList" class="orders-list">

    <!-- EMPTY STATE -->

    <div
        id="emptyOrders"
        class="empty-orders">

        <h3>No orders yet</h3>

        <p>
            You have not made any purchases yet.
        </p>

    </div>

    <!-- FIREBASE ORDERS WILL LOAD HERE -->

</div>
</section>

</div>
