<!-- ==========================================
TRANSACTIONS PAGE
========================================== -->

<div class="transactions-page">

    <!-- PAGE TITLE -->

    <section class="transactions-title">

        <h1>
            Transactions
        </h1>

        <p>
            Your complete transaction history
        </p>

    </section>

    <!-- ==========================================
SEARCH
========================================== -->

    <section class="transaction-search">

        <div class="search-box">

            <i class="ri-search-line"></i>

            <input
                type="text"
                id="searchTransaction"
                placeholder="Search by reference, type, or description">

        </div>

    </section>

    <!-- ==========================================
TRANSACTIONS
========================================== -->

    <section class="transactions-wrapper">

        <h2>
            RECENT TRANSACTIONS
        </h2>

        <div
            id="transactionsList">

            <!-- ==========================================
EMPTY STATE
========================================== -->

<div
    id="emptyTransactions"
    class="empty-transactions">

    <i class="ri-file-list-3-line"></i>

    <h3>
        No transaction records
    </h3>

    <p>
        Your wallet top-ups and purchases will appear here automatically.
    </p>

</div>
