<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tools Store</title>

    <!-- Main Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Tools Store Styles -->
    <link rel="stylesheet" href="tools.css">

    <!-- Remix Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">

</head>

<body>

    <!-- ==========================
         TOOLS STORE PAGE
    =========================== -->

    <main class="tools-page">

        <!-- PAGE TITLE -->

        <section class="tools-header">

            <h1>Tools Store</h1>

            <p>
                Updates, picture sets, and more
                <span id="totalTools">
                    0 tools available
                </span>
            </p>

        </section>

        <!-- SEARCH -->

        <section class="tools-search">

            <div class="search-box">

                <i class="ri-search-line"></i>

                <input
                    type="text"
                    id="searchTools"
                    placeholder="Search tools...">

            </div>

        </section>

        <!-- CATEGORY BUTTONS -->

        <section class="tool-categories">

            <button
                class="category-btn active"
                data-category="all">

                All

                <span id="allCount">0</span>

            </button>

            <button
                class="category-btn"
                data-category="working_pictures">

                Working Pictures

                <span id="pictureCount">0</span>

            </button>

            <button
                class="category-btn"
                data-category="working_tools">

                Working Tools

                <span id="toolCount">0</span>

            </button>

        </section>
                <!-- ==========================
             TOOLS LIST
        =========================== -->

        <section class="tools-container">

            <div id="toolsList">

                <!-- EMPTY STATE -->

                <div
                    id="emptyTools"
                    class="empty-tools">

                    <i class="ri-tools-line"></i>

                    <h3>
                        No tools available
                    </h3>

                    <p>
                        New tools and working pictures will appear here once they are added by the admin.
                    </p>

                </div>

                <!-- Firebase tools will be inserted here -->

            </div>

        </section>

    </main>
