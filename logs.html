<!-- ==========================================
LOGS STORE PAGE
========================================== -->

<div class="logs-page">

    <!-- PAGE TITLE -->

    <section class="logs-title">

        <h1>Logs Store</h1>

        <p>
            Browse and purchase verified social media accounts
        </p>

    </section>

    <!-- ==========================================
    LIST HEADER
    ========================================== -->

    <section class="listing-header">

        <div class="listing-text">

            <h2>All listings</h2>

            <span id="listingCount">
                0 accounts available
            </span>

            <p>
                Browse available verified social media accounts
                and buy instantly from your wallet.
            </p>

        </div>

        <button
            id="filterBtn"
            class="filter-btn">

            <i class="ri-equalizer-line"></i>

        </button>

    </section>
        <!-- ==========================================
    PRODUCT LIST
    ========================================== -->

    <section class="logs-container">

        <div id="logsList">

            <!-- EMPTY STATE -->

            <div
                id="emptyLogs"
                class="empty-logs">

                <i class="ri-shopping-bag-3-line"></i>

                <h3>
                    No accounts available
                </h3>

                <p>
                    New verified accounts will appear here once they are added.
                </p>

            </div>

            <!-- FIREBASE PRODUCTS WILL LOAD HERE -->

        </div>

    </section>

</div>
